<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Belanja Amanah</title>
    <link rel=" " href="Style.css">
</head>
<body>
    <header>
        <h1>Toko Makanan ringan</h1>
    </header>

    <main class="container">
        
        <section class="produk-section">
            <h2>Daftar Produk</h2>
            <div id="daftar-produk" class="grid-produk">
                
            </div>
        </section>

       
        <section class="keranjang-section">
            <h2>Keranjang Belanja</h2>
            <div id="info-keranjang" class="info-keranjang">

            </div>
            
            <ul id="list-keranjang">
                
            </ul>

            <div class="aksi-keranjang">
                <button id="btn-hapus-terakhir" class="btn-bahaya">Hapus barang belanja Terakhir</button>
                <button id="btn-checkout" class="btn-sukses">Checkout</button>
            </div>
            
            <div id="Hasil-pesanan" class="Hasil"></div>
        </section>
    </main>

    <script src="Script.js"></script>
</body>
</html>
